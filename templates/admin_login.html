<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیریت | پریا</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="admin-page"><div class="login-card"><a class="logo" href="{{ url_for('home') }}"><span>P</span> پریا</a><p class="eyebrow">پنل مدیریت</p><h1>ورود مدیر</h1><p>برای دیدن درخواست‌های ثبت‌شده، رمز مدیریت را وارد کنید.</p><form method="post"><label>رمز ورود<input type="password" name="password" required autofocus></label><button class="btn primary" type="submit">ورود به پنل ←</button></form>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}<a class="back-link" href="{{ url_for('home') }}">بازگشت به سایت</a></div></body></html>

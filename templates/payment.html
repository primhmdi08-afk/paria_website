<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرداخت آزمایشی | پریا</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="payment-page"><main class="payment-shell"><a class="logo" href="{{ url_for('home') }}"><span>P</span> پریا</a><div class="payment-card"><div class="payment-head"><p class="eyebrow">درگاه پرداخت نمایشی</p><h1>تکمیل سفارش</h1><p>این صفحه فقط برای نمایش روند پرداخت در پروژه مدرسه ساخته شده و هیچ تراکنش واقعی انجام نمی‌دهد.</p></div><div class="order-box"><div><span>پکیج انتخابی</span><strong>{{ r.package }}</strong></div><div><span>مبلغ</span><strong>{% if r.amount %}{{ '{:,}'.format(r.amount) }} تومان{% else %}پس از مشاوره{% endif %}</strong></div></div><div class="fake-gateway"><div class="gateway-top"><span>درگاه امن پریا</span><b>DEMO</b></div><label>شماره کارت<input type="text" placeholder="۶۰۳۷ •••• •••• ••••" maxlength="19"></label><div class="gateway-row"><label>CVV2<input type="text" placeholder="۱۲۳۴" maxlength="4"></label><label>تاریخ انقضا<input type="text" placeholder="۰۴ / ۰۸"></label></div><label>رمز پویا<input type="text" placeholder="رمز آزمایشی" maxlength="6"></label><form method="post" action="{{ url_for('demo_payment', request_id=r.id) }}"><button class="btn primary payment-btn" type="submit">پرداخت آزمایشی</button></form></div><a class="back-link" href="{{ url_for('home') }}">بازگشت به سایت</a></div></main></body></html>
